services:
  mongodb:
    image: mongo:latest
    container_name: namongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - product-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-api:
    build: .
    container_name: product-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://namongodb:27017/productdb
    depends_on:
      - mongodb
    networks:
      - product-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  product-network:
    driver: bridge

volumes:
  mongodb_data: