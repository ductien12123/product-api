services:
  mongodb:
    image: mongo:latest
    container_name: namongodb-prod
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_prod_data:/data/db
    networks:
      - product-prod-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-api:
    image: ductien12123/product-api:latest
    container_name: product-api-prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://namongodb-prod:27017/productdb
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - product-prod-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  product-prod-network:

volumes:
  mongodb_prod_data: