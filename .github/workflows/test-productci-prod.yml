name: Product API Production CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start MongoDB and Product API
        run: docker compose up -d --build

      - name: Check containers
        run: docker compose ps

      - name: Wait for MongoDB healthcheck
        run: |
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' namongodb 2>/dev/null || true)

            echo "MongoDB status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "MongoDB is healthy"
              break
            fi

            sleep 2
          done

          STATUS=$(docker inspect --format='{{.State.Health.Status}}' namongodb)

          if [ "$STATUS" != "healthy" ]; then
            echo "MongoDB healthcheck failed"
            docker compose logs mongodb
            exit 1
          fi

      - name: Wait for Product API
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/ > /dev/null; then
              echo "Product API is ready"
              break
            fi

            echo "Waiting for Product API..."
            sleep 2
          done

          curl -fsS http://localhost:3000/

      - name: CREATE product
        run: |
          curl -fsS -X POST http://localhost:3000/products \
            -H "Content-Type: application/json" \
            -d '{"pid":"CI001","pname":"CI Laptop","price":1500,"quantity":10}'

      - name: READ product
        run: |
          curl -fsS http://localhost:3000/products | grep "CI001"

      - name: UPDATE product
        run: |
          curl -fsS -X PUT http://localhost:3000/products/CI001 \
            -H "Content-Type: application/json" \
            -d '{"quantity":20}' | grep '"quantity":20'

      - name: DELETE product
        run: |
          curl -fsS -X DELETE http://localhost:3000/products/CI001

      - name: Verify DELETE
        run: |
          RESPONSE=$(curl -fsS http://localhost:3000/products)

          if echo "$RESPONSE" | grep -q "CI001"; then
            echo "Product still exists"
            exit 1
          fi

          echo "CRUD test passed"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v