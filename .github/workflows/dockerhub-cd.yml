name: Docker Hub CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ductien12123/product-api:latest

      - name: Verify Docker image
        run: |
          docker pull ductien12123/product-api:latest
          docker image inspect ductien12123/product-api:latest

      - name: Deploy to local Docker Engine
        run: |
          docker compose -f docker-compose-prod.yaml pull product-api
          docker compose -f docker-compose-prod.yaml up -d --force-recreate
          docker compose -f docker-compose-prod.yaml ps

      - name: Verify Product API
        run: |
          curl -fsS http://localhost:3000/