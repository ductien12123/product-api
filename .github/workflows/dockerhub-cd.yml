name: Docker Hub CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ductien12123/product-api:latest

      - name: Verify Docker image
        run: |
          docker pull ductien12123/product-api:latest
          docker image inspect ductien12123/product-api:latest

      - name: Deploy to local Docker Engine
        run: |
          docker compose -f docker-compose-prod.yaml pull product-api
          docker compose -f docker-compose-prod.yaml up -d --force-recreate
          docker compose -f docker-compose-prod.yaml ps

      - name: Verify Product API
        run: |
          for i in {1..30}; do
            echo "Checking Product API... attempt $i"

            STATUS=$(docker inspect --format='{{.State.Health.Status}}' product-api-prod 2>/dev/null || true)

            echo "Container health: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Product API is healthy"
              curl -fsS http://localhost:3000/
              exit 0
            fi

            docker compose -f docker-compose-prod.yaml ps
            sleep 2
          done

          echo "Product API failed healthcheck"

          echo "===== Product API health details ====="
          docker inspect --format='{{json .State.Health}}' product-api-prod

          echo "===== Product API logs ====="
          docker compose -f docker-compose-prod.yaml logs product-api

          echo "===== Direct HTTP test from runner ====="
          curl -v http://localhost:3000/ || true

          exit 1